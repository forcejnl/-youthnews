<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouthNews</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="logo" href="/"><strong>YOUTH<br><span>NEWS</span></strong><small>CAMPUS<br>DAILY</small></a>
    <nav id="sideNav"></nav>
    <div class="sideBottom"><b>Stay in the loop</b><p>Fresh stories from the campus community every day.</p></div>
  </aside>

<div class="mainArea">
  <header class="topbar">

    <button class="mobileMenu" onclick="document.body.classList.toggle('menuOpen')">
      ☰
    </button>

    <div class="search">
      <span>⌕</span>
      <input
        id="searchInput"
        placeholder="Search news, people, or topics..."
        onkeydown="if(event.key==='Enter')doSearch()"
      >
      <button onclick="doSearch()">Search</button>
    </div>

    <div class="topIcons" id="userArea">
      <button type="button" onclick="openAuth('login')">
        Log in
      </button>
    </div>

  </header>
    <main class="content">
      <section class="topGrid">
        <div id="hero"></div>
        <aside class="rightRail">
          <section class="railCard"><h2>↗ Trending Now</h2><div id="trending" class="pills"></div></section>
          <section class="railCard"><h2>News Categories</h2><ul id="categories"></ul></section>
          <section class="railCard"><h2>Upcoming Events</h2><div id="events"></div></section>
        </aside>
      </section>

      <section class="quick">
        <div class="sectionTitle"><h2>⚡ QUICK NEWS</h2><a href="/?all=1">Latest updates</a></div>
        <div id="quickGrid" class="quickGrid"></div>
      </section>

      <div id="filterPills" class="filterPills"></div>
      <div id="sections"></div>

      <section class="trendingBottom">
        <h2>🔥 TRENDING TOPICS</h2><div id="trendingBottom" class="pills"></div>
      </section>
    </main>

    <footer id="footer"></footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div id="authModal" class="authModal hidden">
  <div class="authBox">

    <button class="authClose" onclick="closeAuth()">×</button>

    <h2 id="authTitle">Welcome to YouthNews</h2>
    <p id="authSubtitle">Log in to your account</p>

    <input
      id="authEmail"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="authPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="authSubmit" onclick="submitAuth()">
      Log in
    </button>

    <button class="googleBtn" onclick="googleLogin()">
      Continue with Google
    </button>

    <p id="authError" class="authError"></p>

    <p class="authSwitch">
      <span id="authSwitchText">Don't have an account?</span>
      <button onclick="toggleAuthMode()" id="authSwitchBtn">
        Sign up
      </button>
    </p>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>
</html>
