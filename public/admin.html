<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouthNews Admin</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div id="login" class="login">
  <div class="loginBox">
    <a class="adminLogo" href="/">
      <b>YOUTH<span>NEWS</span></b>
    </a>
<h1>Admin CMS</h1>
<p class="muted">Manage your entire news website from here.</p>
<input id="user" value="admin" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Sign in</button>
<small>
  Default: admin / change-me-now<br>
  Set ADMIN_USER and ADMIN_PASSWORD on Render before public use.
</small>
<p id="err" class="error"></p>
  </div>
</div>
<div id="app" class="hidden">
  <aside>
<a class="adminLogo" href="/">
  <b>YOUTH<span>NEWS</span></b>
</a>
<button onclick="show('dashboard')">▦ Dashboard</button>
<button onclick="show('articles')">▤ News</button>
<button onclick="show('new')">＋ New Article</button>
<button onclick="show('categories')">◈ Categories</button>
<button onclick="show('sections')">▦ Homepage Sections</button>
<button onclick="show('events')">◷ Events</button>
<button onclick="show('trending')">⌁ Trending Topics</button>
<button onclick="show('navigation')">☰ Navigation</button>
<button onclick="show('settings')">⚙ Site Settings</button>
<a href="/" target="_blank">↗ View Website</a>
<button onclick="logout()">⇥ Sign out</button>
  </aside>
  <main>
    <div id="view"></div>
  </main>
</div>
<script>
let cats = [];
let current = null;
/* =========================
   BASIC HELPERS
========================= */
const $ = id => document.getElementById(id);
function esc(s) {
  return String(s ?? "").replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );
}
function attr(s) {
  return esc(s);
}
/* =========================
   API
========================= */
async function api(url, opt = {}) {
  const options = {
    credentials: "same-origin",
    ...opt,
    headers: {
      ...(opt.body instanceof FormData
        ? {}
        : {"Content-Type": "application/json"}),
      ...(opt.headers || {})
    }
  };
  const r = await fetch(url, options);
  if (r.status === 401) {
    showLogin();
    throw new Error("Admin session expired. Please sign in again.");
  }
  let j = {};
  try {
    j = await r.json();
  } catch {
    j = {};
  }
  if (!r.ok) {
    throw new Error(j.error || "Request failed");
  }
  return j;
}
/* =========================
   LOGIN
========================= */
async function login() {
  $("err").textContent = "";
  try {
    const r = await api("/api/login", {
      method: "POST",
      body: JSON.stringify({
        username: $("user").value,
        password: $("pass").value
      })
    });
    if (r.ok) {
      hideLogin();
      await load();
    }
  } catch (e) {
    $("err").textContent = e.message;
  }
}
async function logout() {
  try {
    await api("/api/logout", {
      method: "POST"
    });
  } catch {}
  current = null;
  showLogin();
}
function showLogin() {
  $("login").classList.remove("hidden");
  $("app").classList.add("hidden");
}
function hideLogin() {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
}
async function load() {
  cats = await api("/api/categories?admin=1");
  await show("dashboard");
}
/* =========================
   PAGE SHELL
========================= */
function shell(title, html) {
  $("view").innerHTML = `
    <div class="bar">
      <div>
        <h1>${title}</h1>
      </div>
    </div>
    ${html}
  `;
}
/* =========================
   MAIN NAVIGATION
========================= */
async function show(v) {
  try {
    /* =====================
       DASHBOARD
    ===================== */
    if (v === "dashboard") {
      const a = await api("/api/articles?limit=100&status=all");
      const c = await api("/api/categories?admin=1");
      const s = await api("/api/sections?admin=1");
      shell(
        "Dashboard",
        `
        <div class="stats">
          <div>
            <b>${a.length}</b>
            <span>Total articles</span>
          </div>
          <div>
            <b>${a.filter(x => x.featured).length}</b>
            <span>Featured</span>
          </div>
          <div>
            <b>${a.reduce((n,x) => n + (x.views || 0), 0)}</b>
            <span>Total views</span>
          </div>
          <div>
            <b>${c.length}</b>
            <span>Categories</span>
          </div>
          <div>
            <b>${s.filter(x => x.enabled).length}</b>
            <span>Active sections</span>
          </div>
        </div>
        <div class="panel">
          <h2>CMS ready</h2>
          <p>
            Create articles, categories and homepage sections.
            You can also control events, trending topics,
            navigation and site settings without editing code.
          </p>
        </div>
        `
      );
    }
    /* =====================
       ARTICLES
    ===================== */
    if (v === "articles") {
      const a = await api(
        "/api/articles?limit=100&status=all"
      );
      shell(
        "News",
        `
        <div class="toolbar">
          <button onclick="show('new')">
            ＋ New Article
          </button>
        </div>
        <div class="table">
          ${a.map(x => `
            <div class="row">
              <div class="rowImg">
                ${
                  x.image
                    ? `<img src="${attr(x.image)}">`
                    : ""
                }
              </div>
              <div>
                <b>${esc(x.title)}</b>
                <small>
                  ${esc(x.category_name || "No category")}
                  ·
                  ${esc(x.status)}
                  ·
                  ${x.views || 0} views
                </small>
              </div>
              <button onclick="editArticle(${x.id})">
                Edit
              </button>
              <button
                class="danger"
                onclick="delArticle(${x.id})">
                Delete
              </button>
            </div>
          `).join("")}
        </div>
        `
      );
    }
    /* =====================
       NEW ARTICLE
    ===================== */
    if (v === "new") {
      current = null;
      if (!cats.length) {
        cats = await api("/api/categories?admin=1");
      }
      articleEditor();
    }
    /* =====================
       CATEGORIES
    ===================== */
    if (v === "categories") {
      cats = await api("/api/categories?admin=1");
      shell(
        "Categories",
        `
        <div class="form">
          <h2>Add category</h2>
          <div class="two">
            <label>
              Name
              <input id="c_name">
            </label>
            <label>
              Slug
              <input id="c_slug">
            </label>
          </div>
          <button onclick="addCategory()">
            Add Category
          </button>
        </div>
        <div class="list">
          ${cats.map(c => `
            <div class="listRow">
              <div>
                <b>${esc(c.name)}</b>
                <small>
                  ${esc(c.slug)}
                </small>
              </div>
              <button onclick='editCategory(${JSON.stringify(c)})'>
                Edit
              </button>
              <button
                class="danger"
                onclick="delCategory(${c.id})">
                Delete
              </button>
            </div>
          `).join("")}
        </div>
        `
      );
    }
    /* =====================
       HOMEPAGE SECTIONS
    ===================== */
    if (v === "sections") {
      const s = await api("/api/sections?admin=1");
      cats = await api("/api/categories?admin=1");
      shell(
        "Homepage Sections",
        `
        <div class="form">
          <h2>Add section</h2>
          <div class="two">
            <label>
              Section title
              <input
                id="sec_title"
                placeholder="TECHNOLOGY">
            </label>
            <label>
              Category
              <select id="sec_cat">
                <option value="">
                  Any category
                </option>
                ${cats.map(c => `
                  <option value="${c.id}">
                    ${esc(c.name)}
                  </option>
                `).join("")}
              </select>
            </label>
          </div>
          <div class="three">
            <label>
              Columns
              <select id="sec_cols">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </label>
            <label>
              Articles
              <input
                id="sec_limit"
                type="number"
                min="1"
                max="12"
                value="2">
            </label>
            <label>
              Position
              <input
                id="sec_position"
                type="number"
                value="0">
            </label>
          </div>
          <label>
            Enabled
            <select id="sec_enabled">
              <option value="1">
                Yes
              </option>
              <option value="0">
                No
              </option>
            </select>
          </label>
          <button onclick="addSection()">
            Add Section
          </button>
        </div>
        <div class="list">
          ${s.map(x => `
            <div class="listRow">
              <div>
                <b>${esc(x.title)}</b>
                <small>
                  ${esc(x.category_name || "Any category")}
                  ·
                  ${x.columns_count} columns
                  ·
                  ${x.article_limit} articles
                  ·
                  ${x.enabled ? "Enabled" : "Disabled"}
                </small>
              </div>
              <button onclick='editSection(${JSON.stringify(x)})'>
                Edit
              </button>
              <button
                class="danger"
                onclick="delSection(${x.id})">
                Delete
              </button>
            </div>
          `).join("")}
        </div>
        `
      );
    }
    /* =====================
       EVENTS
    ===================== */
    if (v === "events") {
      const e = await api("/api/events?admin=1");
      shell(
        "Upcoming Events",
        `
        <div class="form">
          <h2>Add event</h2>
          <div class="two">
            <label>
              Date
              <input
                id="e_date"
                type="date">
            </label>
            <label>
              Time
              <input
                id="e_time"
                type="time">
            </label>
          </div>
          <label>
            Title
            <input id="e_title">
          </label>
          <label>
            Location
            <input
              id="e_location"
              placeholder="Main Hall">
          </label>
          <label>
            Description
            <input
              id="e_description"
              placeholder="09:00 – 16:00 · Main Hall">
          </label>
          <label>
            Position
            <input
              id="e_position"
              type="number"
              value="0">
          </label>
          <label>
            Enabled
            <select id="e_enabled">
              <option value="1">
                Yes
              </option>
              <option value="0">
                No
              </option>
            </select>
          </label>
          <button onclick="addEvent()">
            Add Event
          </button>
        </div>
        <div class="list">
          ${e.map(x => `
            <div class="listRow">
              <div>
                <b>
                  ${esc(x.event_date || "")}
                  ·
                  ${esc(x.title)}
                </b>
                <small>
                  ${esc(x.event_time || "")}
                  ${x.location ? " · " + esc(x.location) : ""}
                  ${x.description ? " · " + esc(x.description) : ""}
                </small>
              </div>
              <button onclick='editEvent(${JSON.stringify(x)})'>
                Edit
              </button>
              <button
                class="danger"
                onclick="delEvent(${x.id})">
                Delete
              </button>
            </div>
          `).join("")}
        </div>
        `
      );
    }
    /* =====================
       TRENDING
    ===================== */
    if (v === "trending") {
      const t = await api("/api/trending?admin=1");
      shell(
        "Trending Topics",
        `
        <div class="form">
          <h2>Add topic</h2>
          <div class="two">
            <label>
              Topic
              <input
                id="t_label"
                placeholder="#AI">
            </label>
            <label>
              Position
              <input
                id="t_position"
                type="number"
                value="0">
            </label>
          </div>
          <button onclick="addTrending()">
            Add Topic
          </button>
        </div>
        <div class="list">
          ${t.map(x => `
            <div class="listRow">
              <div>
                <b>${esc(x.label)}</b>
                <small>
                  ${esc(x.slug || "")}
                  · Position ${x.position ?? 0}
                  · ${x.enabled ? "Enabled" : "Disabled"}
                </small>
              </div>
              <button onclick='editTrending(${JSON.stringify(x)})'>
                Edit
              </button>
              <button
                class="danger"
                onclick="delTrending(${x.id})">
                Delete
              </button>
            </div>
          `).join("")}
        </div>
        `
      );
    }
    /* =====================
       NAVIGATION
    ===================== */
    if (v === "navigation") {
      const n = await api("/api/navigation?admin=1");
      shell(
        "Navigation",
        `
        <div class="form">
          <h2>Add menu item</h2>
          <div class="two">
            <label>
              Label
              <input
                id="n_label"
                placeholder="Technology">
            </label>
            <label>
              URL
              <input
                id="n_url"
                placeholder="/?category=technology">
            </label>
          </div>
          <div class="two">
            <label>
              Position
              <input
                id="n_position"
                type="number"
                value="0">
            </label>
            <label>
              Enabled
              <select id="n_enabled">
                <option value="1">
                  Yes
                </option>
                <option value="0">
                  No
                </option>
              </select>
            </label>
          </div>
          <button onclick="addNav()">
            Add Menu Item
          </button>
        </div>
        <div class="list">
          ${n.map(x => `
            <div class="listRow">
              <div>
                <b>${esc(x.label)}</b>
                <small>
                  ${esc(x.url)}
                  · Position ${x.position ?? 0}
                  · ${x.enabled ? "Enabled" : "Disabled"}
                </small>
              </div>
              <button onclick='editNav(${JSON.stringify(x)})'>
                Edit
              </button>
              <button
                class="danger"
                onclick="delNav(${x.id})">
                Delete
              </button>
            </div>
          `).join("")}
        </div>
        `
      );
    }
    /* =====================
       SETTINGS
    ===================== */
    if (v === "settings") {
      const s = await api("/api/settings");
      shell(
        "Site Settings",
        `
        <div class="form">
          <label>
            Site name
            <input
              id="s_name"
              value="${attr(s.site_name)}">
          </label>
          <label>
            Tagline
            <input
              id="s_tag"
              value="${attr(s.tagline)}">
          </label>
          <label>
            Search placeholder
            <input
              id="s_search"
              value="${attr(s.search_placeholder)}">
          </label>
          <label>
            Hero button text
            <input
              id="s_btn"
              value="${attr(s.hero_button)}">
          </label>
          <label>
            Contact email
            <input
              id="s_contact"
              value="${attr(s.contact)}">
          </label>
          <label>
            Footer text
            <input
              id="s_footer"
              value="${attr(s.footer_text)}">
          </label>
          <button onclick="saveSettings()">
            Save Settings
          </button>
        </div>
        `
      );
    }
  } catch (e) {
    alert(e.message);
  }
}
/* =========================
   ARTICLE EDITOR
========================= */
function articleEditor() {
  const a = current || {
    title: "",
    excerpt: "",
    content: "",
    image: "",
    category_id: "",
    author: "YouthNews",
    status: "published",
    featured: false
  };
  shell(
    current ? "Edit Article" : "New Article",
    `
    <div class="form">
      <label>
        Headline
        <input
          id="f_title"
          value="${attr(a.title)}">
      </label>
      <label>
        Excerpt
        <textarea id="f_excerpt">${esc(a.excerpt)}</textarea>
  </label>
  <label>
    Article content
    <textarea
      id="f_content"
      rows="15">${esc(a.content)}</textarea>
  </label>
  <div class="two">
    <label>
      Category
      <select id="f_cat">
        <option value="">
          -- Select --
        </option>
        ${cats.map(c => `
          <option
            value="${c.id}"
            ${String(c.id) === String(a.category_id) ? "selected" : ""}>
            ${esc(c.name)}
          </option>
        `).join("")}
      </select>
    </label>
    <label>
      Author
      <input
        id="f_author"
        value="${attr(a.author)}">
    </label>
  </div>
  <div class="two">
    <label>
      Status
      <select id="f_status">
        <option
          value="published"
          ${a.status === "published" ? "selected" : ""}>
          Published
        </option>
        <option
          value="draft"
          ${a.status === "draft" ? "selected" : ""}>
          Draft
        </option>
      </select>
    </label>
    <label>
      Cover image URL
      <input
        id="f_image"
        value="${attr(a.image)}">
    </label>
  </div>
  <label>
    Upload image
    <input
      type="file"
      id="f_file"
      accept="image/*"
      onchange="uploadImage()">
  </label>
  <label class="check">
    <input
      type="checkbox"
      id="f_featured"
      ${a.featured ? "checked" : ""}>
    Featured article
  </label>
  <button onclick="saveArticle()">
    Save Article
  </button>
</div>
`

);

}

/* =========================
ARTICLE ACTIONS
========================= */

async function editArticle(id) {

const a = await api(
“/api/articles?limit=100&status=all”
);

current = a.find(x => x.id === id);

if (!current) {
throw new Error(“Article not found.”);
}

articleEditor();

}

async function uploadImage() {

try {

const f = $("f_file").files[0];
if (!f) return;
const fd = new FormData();
fd.append("image", f);
const r = await fetch(
  "/api/upload",
  {
    method: "POST",
    credentials: "same-origin",
    body: fd
  }
);
if (r.status === 401) {
  showLogin();
  throw new Error(
    "Admin session expired. Please sign in again."
  );
}
const j = await r.json();
if (!r.ok) {
  throw new Error(j.error || "Upload failed.");
}
$("f_image").value = j.url;

} catch (e) {

alert(e.message);

}

}

async function saveArticle() {

const body = {

title: $("f_title").value,
excerpt: $("f_excerpt").value,
content: $("f_content").value,
image: $("f_image").value,
category_id: $("f_cat").value || null,
author: $("f_author").value,
status: $("f_status").value,
featured: $("f_featured").checked

};

await api(
current
? “/api/articles/” + current.id
: “/api/articles”,

{
  method: current ? "PUT" : "POST",
  body: JSON.stringify(body)
}

);

current = null;

await show(“articles”);

}

async function delArticle(id) {

if (!confirm(“Delete this article?”)) return;

await api(
“/api/articles/” + id,
{
method: “DELETE”
}
);

await show(“articles”);

}

/* =========================
CATEGORIES
========================= */

function editCategory(c) {

const name = prompt(
“Category name:”,
c.name
);

if (name === null) return;

const slug = prompt(
“Slug:”,
c.slug
);

if (slug === null) return;

api(
“/api/categories/” + c.id,
{
method: “PUT”,

  body: JSON.stringify({
    name,
    slug
  })
}

)
.then(() => show(“categories”))
.catch(e => alert(e.message));

}

async function addCategory() {

await api(
“/api/categories”,
{
method: “POST”,

  body: JSON.stringify({
    name: $("c_name").value,
    slug: $("c_slug").value
  })
}

);

await show(“categories”);

}

async function delCategory(id) {

if (
!confirm(
“Delete category? Articles will remain but lose this category.”
)
) {
return;
}

await api(
“/api/categories/” + id,
{
method: “DELETE”
}
);

await show(“categories”);

}

/* =========================
HOMEPAGE SECTIONS
========================= */

function editSection(x) {

const title = prompt(
“Section title:”,
x.title
);

if (title === null) return;

const cols = prompt(
“Columns (1-4):”,
x.columns_count
);

if (cols === null) return;

const limit = prompt(
“Articles:”,
x.article_limit
);

if (limit === null) return;

const position = prompt(
“Position:”,
x.position ?? 0
);

if (position === null) return;

api(
“/api/sections/” + x.id,
{
method: “PUT”,

  body: JSON.stringify({
    title,
    category_id:
      x.category_id || null,
    columns_count:
      Number(cols),
    article_limit:
      Number(limit),
    position:
      Number(position),
    enabled:
      !!x.enabled
  })
}

)
.then(() => show(“sections”))
.catch(e => alert(e.message));

}

async function addSection() {

await api(
“/api/sections”,
{
method: “POST”,

  body: JSON.stringify({
    title: $("sec_title").value,
    category_id:
      $("sec_cat").value || null,
    columns_count:
      Number($("sec_cols").value),
    article_limit:
      Number($("sec_limit").value),
    position:
      Number($("sec_position").value),
    enabled:
      $("sec_enabled").value === "1"
  })
}

);

await show(“sections”);

}

async function delSection(id) {

if (!confirm(“Delete section?”)) return;

await api(
“/api/sections/” + id,
{
method: “DELETE”
}
);

await show(“sections”);

}

/* =========================
EVENTS
========================= */

function editEvent(x) {

const date = prompt(
“Date (YYYY-MM-DD):”,
x.event_date || “”
);

if (date === null) return;

const time = prompt(
“Time:”,
x.event_time || “”
);

if (time === null) return;

const title = prompt(
“Title:”,
x.title || “”
);

if (title === null) return;

const location = prompt(
“Location:”,
x.location || “”
);

if (location === null) return;

const description = prompt(
“Description:”,
x.description || “”
);

if (description === null) return;

const position = prompt(
“Position:”,
x.position ?? 0
);

if (position === null) return;

const enabled = confirm(
“Enable this event?”
);

api(
“/api/events/” + x.id,
{
method: “PUT”,

  body: JSON.stringify({
    event_date: date,
    event_time: time,
    title,
    location,
    description,
    position:
      Number(position),
    enabled
  })
}

)
.then(() => show(“events”))
.catch(e => alert(e.message));

}

async function addEvent() {

await api(
“/api/events”,
{
method: “POST”,

/* =========================
TRENDING
========================= */

function editTrending(x) {

const label = prompt(
“Topic:”,
x.label
);

if (label === null) return;

const slug = prompt(
“Slug:”,
x.slug || “”
);

if (slug === null) return;

const position = prompt(
“Position:”,
x.position ?? 0
);

if (position === null) return;

const enabled = confirm(
“Enable this topic?”
);

api(
“/api/trending/” + x.id,
{
method: “PUT”,

  body: JSON.stringify({
    label,
    slug,
    position:
      Number(position),
    enabled
  })
}

)
.then(() => show(“trending”))
.catch(e => alert(e.message));

}

async function addTrending() {

const label = $(“t_label”).value.trim();

if (!label) {
alert(“Please enter a topic.”);
return;
}

const slug = label
.toLowerCase()
.replace(/^#+/, “”)
.trim()
.replace(/[^a-z0-9ก-๙]+/g, “-”)
.replace(/^-+|-+$/g, “”);

await api(
“/api/trending”,
{
method: “POST”,

  body: JSON.stringify({
    label,
    slug,
    position:
      Number($("t_position").value),
    enabled: true
  })
}

);

await show(“trending”);

}

async function delTrending(id) {

if (!confirm(“Delete topic?”)) return;

await api(
“/api/trending/” + id,
{
method: “DELETE”
}
);

await show(“trending”);

}
