<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouthNews Admin</title><link rel="stylesheet" href="/admin.css"></head><body>
<div id="login" class="login"><div class="loginBox"><a class="adminLogo" href="/"><b>YOUTH<span>NEWS</span></b></a><h1>Admin CMS</h1><p class="muted">Manage the YouthNews website.</p><input id="user" value="admin" placeholder="Username" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">Sign in</button><p id="err" class="error"></p></div></div>
<div id="app" class="hidden"><aside><a class="adminLogo" href="/"><b>YOUTH<span>NEWS</span></b></a><button onclick="show('dashboard')">▦ Dashboard</button><button onclick="show('articles')">▤ News</button><button onclick="show('new')">＋ New Article</button><button onclick="show('categories')">◈ Categories</button><button onclick="show('sections')">▦ Homepage Sections</button><button onclick="show('events')">◷ Events</button><button onclick="show('trending')">⌁ Trending Topics</button><button onclick="show('navigation')">☰ Navigation</button><button onclick="show('settings')">⚙ Site Settings</button><a href="/" target="_blank">↗ View Website</a><button onclick="logout()">⇥ Sign out</button></aside><main><div id="view"></div></main></div>
<script>
let cats=[];let current=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function attr(s){return esc(s).replace(/\n/g,"&#10;");}
async function api(url,options={}){const r=await fetch(url,{credentials:"same-origin",...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});let j=null;try{j=await r.json()}catch(_){}if(r.status===401){showLogin();throw new Error("Admin session expired. Please sign in again.")}if(!r.ok)throw new Error(j?.error||`Request failed (${r.status})`);return j;}
function showLogin(){$("login").classList.remove("hidden");$("app").classList.add("hidden");}
async function login(){try{const j=await api("/api/login",{method:"POST",body:JSON.stringify({username:$("user").value.trim(),password:$("pass").value})});if(j.ok){$("login").classList.add("hidden");$("app").classList.remove("hidden");await show("dashboard")}}catch(e){$("err").textContent=e.message}}
async function logout(){try{await api("/api/logout",{method:"POST"})}finally{showLogin();}}
function shell(title,body){$("view").innerHTML=`<div class="top"><div><h1>${esc(title)}</h1><p class="muted">YouthNews content management</p></div></div>${body}`}
async function show(v){try{if(v==='dashboard'){const [a,c,s,e,t,n]=await Promise.all([api('/api/articles?limit=100&status=all'),api('/api/categories'),api('/api/sections?admin=1'),api('/api/events?admin=1'),api('/api/trending?admin=1'),api('/api/navigation?admin=1')]);shell('Dashboard',`<div class="stats"><div><b>${a.length}</b><span>Articles</span></div><div><b>${a.filter(x=>x.status==='published').length}</b><span>Published</span></div><div><b>${c.length}</b><span>Categories</span></div><div><b>${s.length}</b><span>Sections</span></div><div><b>${e.length}</b><span>Events</span></div><div><b>${t.length}</b><span>Trending</span></div><div><b>${n.length}</b><span>Navigation</span></div></div><div class="panel"><h2>System</h2><p>Public user login is disabled. Only the Admin CMS uses authentication.</p><p class="muted">Use the left menu to manage every homepage component.</p></div>`);return}
if(v==='articles'){const a=await api('/api/articles?limit=100&status=all');shell('News',`<div class="actions"><button onclick="show('new')">＋ New Article</button></div><div class="table">${a.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><small>${esc(x.category_name||'Uncategorized')} · ${esc(x.status)} · ${x.featured?'Featured · ':''}${Number(x.views||0)} views</small></div><div><button onclick="editArticle(${x.id})">Edit</button><button class="danger" onclick="delArticle(${x.id})">Delete</button></div></div>`).join('')||'<p class="muted">No articles yet.</p>'}</div>`);return}
if(v==='new'){current=null;await loadCats();editor();return}
if(v==='categories'){const c=await api('/api/categories');shell('Categories',`<div class="panel form"><h2>Add category</h2><div class="two"><label>Name<input id="c_name"></label><label>Slug<input id="c_slug" placeholder="auto-generated if blank"></label></div><button onclick="addCategory()">Add Category</button></div><div class="table">${c.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><small>${esc(x.slug)}</small></div><div><button onclick='editCategory(${JSON.stringify(x)})'>Edit</button><button class="danger" onclick="delCategory(${x.id})">Delete</button></div></div>`).join('')}</div>`);return}
if(v==='sections'){await loadCats();const s=await api('/api/sections?admin=1');shell('Homepage Sections',`<div class="panel form"><h2>Add section</h2><div class="two"><label>Title<input id="s_title"></label><label>Category<select id="s_cat"><option value="">No category</option>${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label></div><div class="three"><label>Columns<select id="s_cols"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label><label>Articles<input id="s_limit" type="number" min="1" max="12" value="2"></label><label>Position<input id="s_pos" type="number" value="0"></label></div><label>Enabled<select id="s_enabled"><option value="1">Yes</option><option value="0">No</option></select></label><button onclick="addSection()">Add Section</button></div><div class="table">${s.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><small>${esc(x.category_name||'No category')} · ${x.columns_count} columns · ${x.article_limit} articles · ${x.enabled?'Enabled':'Disabled'}</small></div><div><button onclick='editSection(${JSON.stringify(x)})'>Edit</button><button class="danger" onclick="delSection(${x.id})">Delete</button></div></div>`).join('')||'<p class="muted">No sections yet.</p>'}</div>`);return}
if(v==='events'){const e=await api('/api/events?admin=1');shell('Upcoming Events',`<div class="panel form"><h2>Add event</h2><div class="two"><label>Title<input id="e_title"></label><label>Date<input id="e_date" type="date"></label><label>Time<input id="e_time" placeholder="10:00 AM"></label><label>Location<input id="e_location"></label></div><label>Description<textarea id="e_desc"></textarea></label><div class="two"><label>Position<input id="e_pos" type="number" value="0"></label><label>Enabled<select id="e_enabled"><option value="1">Yes</option><option value="0">No</option></select></label></div><button onclick="addEvent()">Add Event</button></div><div class="table">${e.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><small>${esc(x.event_date||'No date')} · ${esc(x.event_time||'')} · ${esc(x.location||'')} · ${x.enabled?'Enabled':'Disabled'}</small></div><div><button onclick='editEvent(${JSON.stringify(x)})'>Edit</button><button class="danger" onclick="delEvent(${x.id})">Delete</button></div></div>`).join('')||'<p class="muted">No events yet.</p>'}</div>`);return}
if(v==='trending'){const t=await api('/api/trending?admin=1');shell('Trending Topics',`<div class="panel form"><h2>Add topic</h2><div class="three"><label>Label<input id="t_label" placeholder="#CampusLife"></label><label>Slug<input id="t_slug"></label><label>Position<input id="t_pos" type="number" value="0"></label></div><label>Enabled<select id="t_enabled"><option value="1">Yes</option><option value="0">No</option></select></label><button onclick="addTrending()">Add Topic</button></div><div class="table">${t.map(x=>`<div class="row"><div><b>${esc(x.label)}</b><small>${esc(x.slug)} · ${x.enabled?'Enabled':'Disabled'}</small></div><div><button onclick='editTrending(${JSON.stringify(x)})'>Edit</button><button class="danger" onclick="delTrending(${x.id})">Delete</button></div></div>`).join('')||'<p class="muted">No topics yet.</p>'}</div>`);return}
if(v==='navigation'){const n=await api('/api/navigation?admin=1');shell('Navigation',`<div class="panel form"><h2>Add navigation item</h2><div class="three"><label>Label<input id="n_label"></label><label>URL<input id="n_url" placeholder="/?category=career"></label><label>Position<input id="n_pos" type="number" value="0"></label></div><label>Enabled<select id="n_enabled"><option value="1">Yes</option><option value="0">No</option></select></label><button onclick="addNav()">Add Item</button></div><div class="table">${n.map(x=>`<div class="row"><div><b>${esc(x.label)}</b><small>${esc(x.url)} · ${x.enabled?'Enabled':'Disabled'}</small></div><div><button onclick='editNav(${JSON.stringify(x)})'>Edit</button><button class="danger" onclick="delNav(${x.id})">Delete</button></div></div>`).join('')}</div>`);return}
if(v==='settings'){const s=await api('/api/settings');shell('Site Settings',`<div class="panel form"><label>Site name<input id="set_site" value="${attr(s.site_name)}"></label><label>Tagline<input id="set_tag" value="${attr(s.tagline)}"></label><label>Breaking text<input id="set_break" value="${attr(s.breaking)}"></label><label>Search placeholder<input id="set_search" value="${attr(s.search_placeholder)}"></label><label>Hero button<input id="set_hero" value="${attr(s.hero_button)}"></label><label>Footer text<input id="set_footer" value="${attr(s.footer_text)}"></label><label>Facebook URL<input id="set_fb" value="${attr(s.facebook)}"></label><label>Instagram URL<input id="set_ig" value="${attr(s.instagram)}"></label><label>Contact<input id="set_contact" value="${attr(s.contact)}"></label><button onclick="saveSettings()">Save Settings</button></div>`);return}
}catch(e){console.error(e);alert(e.message)}}
async function loadCats(){cats=await api('/api/categories')}
function editor(){const a=current||{title:'',excerpt:'',content:'',image:'',category_id:'',author:'YouthNews',status:'published',featured:false};shell(current?'Edit Article':'New Article',`<div class="panel form"><label>Title<input id="f_title" value="${attr(a.title)}"></label><label>Excerpt<textarea id="f_excerpt">${esc(a.excerpt)}</textarea></label><label>Content<textarea id="f_content" class="contentArea">${esc(a.content)}</textarea></label><div class="two"><label>Category<select id="f_cat"><option value="">Uncategorized</option>${cats.map(c=>`<option value="${c.id}" ${String(a.category_id)===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Author<input id="f_author" value="${attr(a.author)}"></label><label>Status<select id="f_status"><option value="published" ${a.status==='published'?'selected':''}>Published</option><option value="draft" ${a.status==='draft'?'selected':''}>Draft</option></select></label><label>Cover image URL<input id="f_image" value="${attr(a.image)}"></label></div><label>Upload image<input type="file" id="f_file" accept="image/jpeg,image/png,image/webp,image/gif" onchange="uploadImage()"></label><label class="check"><input id="f_featured" type="checkbox" ${a.featured?'checked':''}> Featured article</label><div class="actions"><button onclick="saveArticle()">Save Article</button><button class="secondary" onclick="show('articles')">Cancel</button></div></div>`)}
async function editArticle(id){await loadCats();const a=await api('/api/articles?limit=100&status=all');current=a.find(x=>Number(x.id)===Number(id));if(!current)throw new Error('Article not found.');editor()}
async function uploadImage(){const f=$("f_file").files[0];if(!f)return;const fd=new FormData();fd.append('image',f);try{const r=await fetch('/api/upload',{method:'POST',credentials:'same-origin',body:fd});const j=await r.json();if(r.status===401){showLogin();throw new Error('Admin session expired.')}if(!r.ok)throw new Error(j.error||'Upload failed');$("f_image").value=j.url}catch(e){alert(e.message)}}
async function saveArticle(){const body={title:$("f_title").value.trim(),excerpt:$("f_excerpt").value,content:$("f_content").value,image:$("f_image").value,category_id:$("f_cat").value||null,author:$("f_author").value.trim()||'YouthNews',status:$("f_status").value,featured:$("f_featured").checked};await api(current?`/api/articles/${current.id}`:'/api/articles',{method:current?'PUT':'POST',body:JSON.stringify(body)});current=null;await show('articles')}
async function delArticle(id){if(!confirm('Delete this article?'))return;await api(`/api/articles/${id}`,{method:'DELETE'});await show('articles')}
function editCategory(c){const name=prompt('Category name:',c.name);if(name===null)return;const slug=prompt('Slug:',c.slug);if(slug===null)return;api(`/api/categories/${c.id}`,{method:'PUT',body:JSON.stringify({name,slug})}).then(()=>show('categories')).catch(e=>alert(e.message))}
async function addCategory(){await api('/api/categories',{method:'POST',body:JSON.stringify({name:$("c_name").value,slug:$("c_slug").value})});await show('categories')}
async function delCategory(id){if(!confirm('Delete this category? Articles will remain but lose their category.'))return;await api(`/api/categories/${id}`,{method:'DELETE'});await show('categories')}
async function addSection(){await api('/api/sections',{method:'POST',body:JSON.stringify({title:$("s_title").value,category_id:$("s_cat").value||null,columns_count:Number($("s_cols").value),article_limit:Number($("s_limit").value),position:Number($("s_pos").value),enabled:$("s_enabled").value==='1'})});await show('sections')}
function editSection(x){const title=prompt('Section title:',x.title);if(title===null)return;const category=prompt('Category ID (blank for none):',x.category_id||'');const cols=prompt('Columns 1-4:',x.columns_count);const limit=prompt('Articles 1-12:',x.article_limit);const pos=prompt('Position:',x.position);const enabled=confirm('Enable this section?');api(`/api/sections/${x.id}`,{method:'PUT',body:JSON.stringify({title,category_id:category||null,columns_count:Number(cols),article_limit:Number(limit),position:Number(pos),enabled})}).then(()=>show('sections')).catch(e=>alert(e.message))}
async function delSection(id){if(!confirm('Delete this section?'))return;await api(`/api/sections/${id}`,{method:'DELETE'});await show('sections')}
async function addEvent(){await api('/api/events',{method:'POST',body:JSON.stringify({title:$("e_title").value,event_date:$("e_date").value,event_time:$("e_time").value,location:$("e_location").value,description:$("e_desc").value,position:Number($("e_pos").value),enabled:$("e_enabled").value==='1'})});await show('events')}
function editEvent(x){const title=prompt('Title:',x.title);if(title===null)return;const date=prompt('Date YYYY-MM-DD:',x.event_date||'');const time=prompt('Time:',x.event_time||'');const loc=prompt('Location:',x.location||'');const desc=prompt('Description:',x.description||'');const pos=prompt('Position:',x.position);const enabled=confirm('Enable this event?');api(`/api/events/${x.id}`,{method:'PUT',body:JSON.stringify({title,event_date:date,event_time:time,location:loc,description:desc,position:Number(pos),enabled})}).then(()=>show('events')).catch(e=>alert(e.message))}
async function delEvent(id){if(!confirm('Delete this event?'))return;await api(`/api/events/${id}`,{method:'DELETE'});await show('events')}
async function addTrending(){await api('/api/trending',{method:'POST',body:JSON.stringify({label:$("t_label").value,slug:$("t_slug").value,position:Number($("t_pos").value),enabled:$("t_enabled").value==='1'})});await show('trending')}
function editTrending(x){const label=prompt('Label:',x.label);if(label===null)return;const slug=prompt('Slug:',x.slug);if(slug===null)return;const pos=prompt('Position:',x.position);const enabled=confirm('Enable this topic?');api(`/api/trending/${x.id}`,{method:'PUT',body:JSON.stringify({label,slug,position:Number(pos),enabled})}).then(()=>show('trending')).catch(e=>alert(e.message))}
async function delTrending(id){if(!confirm('Delete this topic?'))return;await api(`/api/trending/${id}`,{method:'DELETE'});await show('trending')}
async function addNav(){await api('/api/navigation',{method:'POST',body:JSON.stringify({label:$("n_label").value,url:$("n_url").value,position:Number($("n_pos").value),enabled:$("n_enabled").value==='1'})});await show('navigation')}
function editNav(x){const label=prompt('Label:',x.label);if(label===null)return;const url=prompt('URL:',x.url);if(url===null)return;const pos=prompt('Position:',x.position);const enabled=confirm('Enable this navigation item?');api(`/api/navigation/${x.id}`,{method:'PUT',body:JSON.stringify({label,url,position:Number(pos),enabled})}).then(()=>show('navigation')).catch(e=>alert(e.message))}
async function delNav(id){if(!confirm('Delete this navigation item?'))return;await api(`/api/navigation/${id}`,{method:'DELETE'});await show('navigation')}
async function saveSettings(){const body={site_name:$("set_site").value,tagline:$("set_tag").value,breaking:$("set_break").value,search_placeholder:$("set_search").value,hero_button:$("set_hero").value,footer_text:$("set_footer").value,facebook:$("set_fb").value,instagram:$("set_ig").value,contact:$("set_contact").value};await api('/api/settings',{method:'PUT',body:JSON.stringify(body)});alert('Settings saved.')}
(async()=>{try{const me=await api('/api/me');if(me){$("login").classList.add('hidden');$("app").classList.remove('hidden');await show('dashboard')}}catch(e){console.error(e)}})();
</script></body></html>
