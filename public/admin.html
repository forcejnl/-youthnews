<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouthNews Admin</title><link rel="stylesheet" href="/admin.css"></head>
<body>
<div id="login" class="login"><div class="loginBox"><a class="adminLogo" href="/"><b>YOUTH<span>NEWS</span></b></a><h1>Admin CMS</h1><p class="muted">Manage your entire news website from here.</p><input id="user" value="admin" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Sign in</button><small>Default: admin / change-me-now<br>Set ADMIN_USER and ADMIN_PASSWORD on Render before public use.</small><p id="err" class="error"></p></div></div>
<div id="app" class="hidden">
<aside><a class="adminLogo" href="/"><b>YOUTH<span>NEWS</span></b></a>
<button onclick="show('dashboard')">▦ Dashboard</button><button onclick="show('articles')">▤ News</button><button onclick="show('new')">＋ New Article</button><button onclick="show('categories')">◈ Categories</button><button onclick="show('sections')">▦ Homepage Sections</button><button onclick="show('events')">◷ Events</button><button onclick="show('trending')">⌁ Trending Topics</button><button onclick="show('navigation')">☰ Navigation</button><button onclick="show('settings')">⚙ Site Settings</button><a href="/" target="_blank">↗ View Website</a><button onclick="logout()">⇥ Sign out</button></aside>
<main><div id="view"></div></main></div>
<script>
let cats=[],current=null,cache={};
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,{headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});if(r.status===401){showLogin();throw 0}const j=await r.json();if(!r.ok)throw new Error(j.error||"Request failed");return j}
async function login(){try{const r=await api("/api/login",{method:"POST",body:JSON.stringify({username:$("user").value,password:$("pass").value})});if(r.ok){hideLogin();await load()}}catch(e){$("err").textContent=e.message}}
async function logout(){await api("/api/logout",{method:"POST"});showLogin()}
function showLogin(){$("login").classList.remove("hidden");$("app").classList.add("hidden")}
function hideLogin(){$("login").classList.add("hidden");$("app").classList.remove("hidden")}
async function load(){cats=await api("/api/categories?admin=1");show("dashboard")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function attr(s){return esc(s).replace(/"/g,"&quot;")}
function shell(title,html){$("view").innerHTML=`<div class="bar"><div><h1>${title}</h1></div></div>${html}`}
async function show(v){
 try{
 if(v==="dashboard"){let a=await api("/api/articles?limit=100&status=all"),c=await api("/api/categories?admin=1"),s=await api("/api/sections?admin=1");shell("Dashboard",`<div class="stats"><div><b>${a.length}</b><span>Total articles</span></div><div><b>${a.filter(x=>x.featured).length}</b><span>Featured</span></div><div><b>${a.reduce((n,x)=>n+(x.views||0),0)}</b><span>Total views</span></div><div><b>${c.length}</b><span>Categories</span></div><div><b>${s.filter(x=>x.active).length}</b><span>Active sections</span></div></div><div class="panel"><h2>CMS ready</h2><p>Create articles, categories and homepage sections. You can also control events, trending topics, navigation and site settings without editing code.</p></div>`)}
 if(v==="articles"){let a=await api("/api/articles?limit=100&status=all");shell("News",`<div class="toolbar"><button onclick="show('new')">＋ New Article</button></div><div class="table">${a.map(x=>`<div class="row"><div class="rowImg">${x.image?`<img src="${attr(x.image)}">`:""}</div><div><b>${esc(x.title)}</b><small>${esc(x.category_name||"No category")} · ${esc(x.status)} · ${x.views||0} views</small></div><button onclick="editArticle(${x.id})">Edit</button><button class="danger" onclick="delArticle(${x.id})">Delete</button></div>`).join("")}</div>`)}
 if(v==="new"){current=null;articleEditor()}
 if(v==="categories"){cats=await api("/api/categories?admin=1");shell("Categories",`<div class="form"><h2>Add category</h2><div class="two"><label>Name<input id="c_name"></label><label>Slug<input id="c_slug"></label></div><div class="two"><label>Order<input id="c_order" type="number" value="0"></label><label>Active<select id="c_active"><option value="1">Yes</option><option value="0">No</option></select></label></div><button onclick="addCategory()">Add Category</button></div><div class="list">${cats.map(c=>`<div class="listRow"><div><b>${esc(c.name)}</b><small>${esc(c.slug)} · order ${c.sort_order} · ${c.active?"Active":"Hidden"}</small></div><button onclick='editCategory(${JSON.stringify(c)})'>Edit</button><button class="danger" onclick="delCategory(${c.id})">Delete</button></div>`).join("")}</div>`)}
 if(v==="sections"){let s=await api("/api/sections?admin=1");cats=await api("/api/categories?admin=1");shell("Homepage Sections",`<div class="form"><h2>Add section</h2><div class="two"><label>Section title<input id="sec_title" placeholder="TECHNOLOGY"></label><label>Category<select id="sec_cat"><option value="">Any category</option>${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label></div><div class="three"><label>Columns<select id="sec_cols"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label><label>Articles<input id="sec_limit" type="number" min="1" max="12" value="2"></label><label>Order<input id="sec_order" type="number" value="0"></label></div><label>Active<select id="sec_active"><option value="1">Yes</option><option value="0">No</option></select></label><button onclick="addSection()">Add Section</button></div><div class="list">${s.map(x=>`<div class="listRow"><div><b>${esc(x.title)}</b><small>${esc(x.category_name||"Any category")} · ${x.columns} columns · ${x.article_limit} articles · ${x.active?"Active":"Hidden"}</small></div><button onclick='editSection(${JSON.stringify(x)})'>Edit</button><button class="danger" onclick="delSection(${x.id})">Delete</button></div>`).join("")}</div>`)}
 if(v==="events"){let e=await api("/api/events?admin=1").catch(()=>[]);shell("Upcoming Events",`<div class="form"><h2>Add event</h2><div class="three"><label>Day<input id="e_day" placeholder="22"></label><label>Month<input id="e_month" placeholder="MAR"></label><label>Order<input id="e_order" type="number" value="0"></label></div><label>Title<input id="e_title"></label><label>Details<input id="e_details" placeholder="09:00 – 16:00 · Main Hall"></label><button onclick="addEvent()">Add Event</button></div><div class="list">${e.map(x=>`<div class="listRow"><div><b>${esc(x.day)} ${esc(x.month)} · ${esc(x.title)}</b><small>${esc(x.details)}</small></div><button onclick='editEvent(${JSON.stringify(x)})'>Edit</button><button class="danger" onclick="delEvent(${x.id})">Delete</button></div>`).join("")}</div>`)}
 if(v==="trending"){let t=await api("/api/trending?admin=1").catch(()=>[]);shell("Trending Topics",`<div class="form"><h2>Add topic</h2><div class="two"><label>Topic<input id="t_label" placeholder="#AI"></label><label>Order<input id="t_order" type="number" value="0"></label></div><button onclick="addTrending()">Add Topic</button></div><div class="list">${t.map(x=>`<div class="listRow"><div><b>${esc(x.label)}</b><small>Order ${x.sort_order} · ${x.active?"Active":"Hidden"}</small></div><button onclick='editTrending(${JSON.stringify(x)})'>Edit</button><button class="danger" onclick="delTrending(${x.id})">Delete</button></div>`).join("")}</div>`)}
 if(v==="navigation"){let n=await api("/api/navigation?admin=1").catch(()=>[]);shell("Navigation",`<div class="form"><h2>Add menu item</h2><div class="two"><label>Label<input id="n_label" placeholder="Technology"></label><label>URL<input id="n_url" placeholder="/?category=technology"></label></div><div class="two"><label>Order<input id="n_order" type="number" value="0"></label><label>Active<select id="n_active"><option value="1">Yes</option><option value="0">No</option></select></label></div><button onclick="addNav()">Add Menu Item</button></div><div class="list">${n.map(x=>`<div class="listRow"><div><b>${esc(x.label)}</b><small>${esc(x.url)} · order ${x.sort_order}</small></div><button onclick='editNav(${JSON.stringify(x)})'>Edit</button><button class="danger" onclick="delNav(${x.id})">Delete</button></div>`).join("")}</div>`)}
 if(v==="settings"){let s=await api("/api/settings");shell("Site Settings",`<div class="form"><label>Site name<input id="s_name" value="${attr(s.site_name)}"></label><label>Tagline<input id="s_tag" value="${attr(s.tagline)}"></label><label>Search placeholder<input id="s_search" value="${attr(s.search_placeholder)}"></label><label>Hero button text<input id="s_btn" value="${attr(s.hero_button)}"></label><label>Contact email<input id="s_contact" value="${attr(s.contact)}"></label><label>Footer text<input id="s_footer" value="${attr(s.footer_text)}"></label><button onclick="saveSettings()">Save Settings</button></div>`)}
 }catch(e){alert(e.message)}
}
function articleEditor(){let a=current||{title:"",excerpt:"",content:"",image:"",category_id:"",author:"YouthNews",status:"published",featured:false};shell(current?"Edit Article":"New Article",`<div class="form"><label>Headline<input id="f_title" value="${attr(a.title)}"></label><label>Excerpt<textarea id="f_excerpt">${esc(a.excerpt)}</textarea></label><label>Article content<textarea id="f_content" rows="15">${esc(a.content)}</textarea></label><div class="two"><label>Category<select id="f_cat"><option value="">-- Select --</option>${cats.map(c=>`<option value="${c.id}" ${String(c.id)===String(a.category_id)?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label><label>Author<input id="f_author" value="${attr(a.author)}"></label></div><div class="two"><label>Status<select id="f_status"><option value="published" ${a.status==="published"?"selected":""}>Published</option><option value="draft" ${a.status==="draft"?"selected":""}>Draft</option></select></label><label>Cover image URL<input id="f_image" value="${attr(a.image)}"></label></div><label>Upload image<input type="file" id="f_file" accept="image/*" onchange="uploadImage()"></label><label class="check"><input type="checkbox" id="f_featured" ${a.featured?"checked":""}> Featured article</label><button onclick="saveArticle()">Save Article</button></div>`)}
async function editArticle(id){let a=await api("/api/articles?limit=100&status=all");current=a.find(x=>x.id===id);articleEditor()}
async function uploadImage(){let f=$("f_file").files[0];if(!f)return;let fd=new FormData();fd.append("image",f);const r=await fetch("/api/upload",{method:"POST",body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error);$("f_image").value=j.url}
async function saveArticle(){const body={title:$("f_title").value,excerpt:$("f_excerpt").value,content:$("f_content").value,image:$("f_image").value,category_id:$("f_cat").value||null,author:$("f_author").value,status:$("f_status").value,featured:$("f_featured").checked};await api(current?"/api/articles/"+current.id:"/api/articles",{method:current?"PUT":"POST",body:JSON.stringify(body)});show("articles")}
async function delArticle(id){if(confirm("Delete this article?")){await api("/api/articles/"+id,{method:"DELETE"});show("articles")}}
function editCategory(c){const name=prompt("Category name:",c.name);if(name===null)return;const slug=prompt("Slug:",c.slug);if(slug===null)return;const order=prompt("Order:",c.sort_order);if(order===null)return;api("/api/categories/"+c.id,{method:"PUT",body:JSON.stringify({name,slug,sort_order:Number(order),active:c.active})}).then(()=>show("categories")).catch(e=>alert(e.message))}
async function addCategory(){await api("/api/categories",{method:"POST",body:JSON.stringify({name:$("c_name").value,slug:$("c_slug").value,sort_order:Number($("c_order").value),active:$("c_active").value==="1"})});show("categories")}
async function delCategory(id){if(confirm("Delete category? Articles will remain but lose this category.")){await api("/api/categories/"+id,{method:"DELETE"});show("categories")}}
function editSection(x){const title=prompt("Section title:",x.title);if(title===null)return;const cols=prompt("Columns (1-4):",x.columns);if(cols===null)return;const lim=prompt("Articles:",x.article_limit);if(lim===null)return;api("/api/sections/"+x.id,{method:"PUT",body:JSON.stringify({title,category_id:x.category_id,columns:Number(cols),article_limit:Number(lim),sort_order:x.sort_order,active:x.active})}).then(()=>show("sections")).catch(e=>alert(e.message))}
async function addSection(){await api("/api/sections",{method:"POST",body:JSON.stringify({title:$("sec_title").value,category_id:$("sec_cat").value||null,columns:Number($("sec_cols").value),article_limit:Number($("sec_limit").value),sort_order:Number($("sec_order").value),active:$("sec_active").value==="1"})});show("sections")}
async function delSection(id){if(confirm("Delete section?")){await api("/api/sections/"+id,{method:"DELETE"});show("sections")}}
function editEvent(x){const title=prompt("Title:",x.title);if(title===null)return;const details=prompt("Details:",x.details);if(details===null)return;api("/api/events/"+x.id,{method:"PUT",body:JSON.stringify({day:x.day,month:x.month,title,details,sort_order:x.sort_order,active:x.active})}).then(()=>show("events")).catch(e=>alert(e.message))}
async function addEvent(){await api("/api/events",{method:"POST",body:JSON.stringify({day:$("e_day").value,month:$("e_month").value,title:$("e_title").value,details:$("e_details").value,sort_order:Number($("e_order").value),active:true})});show("events")}
async function delEvent(id){if(confirm("Delete event?")){await api("/api/events/"+id,{method:"DELETE"});show("events")}}
function editTrending(x){const label=prompt("Topic:",x.label);if(label===null)return;api("/api/trending/"+x.id,{method:"PUT",body:JSON.stringify({label,sort_order:x.sort_order,active:x.active})}).then(()=>show("trending")).catch(e=>alert(e.message))}
async function addTrending(){await api("/api/trending",{method:"POST",body:JSON.stringify({label:$("t_label").value,sort_order:Number($("t_order").value),active:true})});show("trending")}
async function delTrending(id){if(confirm("Delete topic?")){await api("/api/trending/"+id,{method:"DELETE"});show("trending")}}
function editNav(x){const label=prompt("Label:",x.label);if(label===null)return;const url=prompt("URL:",x.url);if(url===null)return;api("/api/navigation/"+x.id,{method:"PUT",body:JSON.stringify({label,url,category_id:x.category_id,sort_order:x.sort_order,active:x.active})}).then(()=>show("navigation")).catch(e=>alert(e.message))}
async function addNav(){await api("/api/navigation",{method:"POST",body:JSON.stringify({label:$("n_label").value,url:$("n_url").value,sort_order:Number($("n_order").value),active:$("n_active").value==="1"})});show("navigation")}
async function delNav(id){if(confirm("Delete menu item?")){await api("/api/navigation/"+id,{method:"DELETE"});show("navigation")}}
async function saveSettings(){await api("/api/settings",{method:"PUT",body:JSON.stringify({site_name:$("s_name").value,tagline:$("s_tag").value,search_placeholder:$("s_search").value,hero_button:$("s_btn").value,contact:$("s_contact").value,footer_text:$("s_footer").value})});alert("Settings saved.")}
api("/api/me").then(u=>u?(hideLogin(),load()):showLogin());
</script></body></html>
