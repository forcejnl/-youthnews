<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouthNews Admin</title><link rel="stylesheet" href="/admin.css"></head>
<body><div id="login" class="login"><div class="loginBox"><div class="brand"><span>YOUTH</span>NEWS</div><h1>หลังบ้าน</h1><input id="user" placeholder="ชื่อผู้ใช้" value="admin"><input id="pass" type="password" placeholder="รหัสผ่าน"><button onclick="login()">เข้าสู่ระบบ</button><small>ค่าเริ่มต้น: admin / change-me-now<br>ควรเปลี่ยนรหัสผ่านก่อนใช้งานจริง</small><p id="err"></p></div></div>
<div id="app" class="hidden"><aside><div class="brand"><span>YOUTH</span>NEWS</div><button onclick="show('dashboard')">ภาพรวม</button><button onclick="show('articles')">จัดการข่าว</button><button onclick="show('new')">เขียนข่าวใหม่</button><button onclick="show('settings')">ตั้งค่าเว็บไซต์</button><a href="/" target="_blank">ดูเว็บไซต์ ↗</a><button onclick="logout()">ออกจากระบบ</button></aside>
<main><div id="view"></div></main></div>
<script>
let cats=[], current=null;
const $=id=>document.getElementById(id);
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt}); if(r.status===401){showLogin();throw 0} return r.json()}
async function login(){let r=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('user').value,password:$('pass').value})}); if(r.ok){$('login').classList.add('hidden');$('app').classList.remove('hidden');load();}else $('err').textContent=r.error}
async function logout(){await api('/api/logout',{method:'POST'});showLogin()}
function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden')}
async function load(){cats=await api('/api/categories');show('dashboard')}
function show(v){
if(v==='dashboard') $('view').innerHTML='<h1>ภาพรวม</h1><div id="stats" class="stats"></div><div class="panel"><h2>ระบบพร้อมใช้งาน</h2><p>เพิ่ม แก้ไข ลบ และเผยแพร่ข่าวได้จากเมนูจัดการข่าว</p></div>',stats();
if(v==='articles') articles();
if(v==='new'){current=null; editor()}
if(v==='settings') settings();
}
async function stats(){let a=await api('/api/articles?limit=100');$('stats').innerHTML=`<div><b>${a.length}</b><span>ข่าวที่เผยแพร่</span></div><div><b>${a.filter(x=>x.featured).length}</b><span>ข่าวเด่น</span></div><div><b>${a.reduce((s,x)=>s+x.views,0)}</b><span>ยอดอ่าน</span></div>`}
async function articles(){let a=await api('/api/articles?limit=100');$('view').innerHTML='<div class="bar"><h1>จัดการข่าว</h1><button onclick="show(\'new\')">+ เขียนข่าว</button></div><div class="table">'+a.map(x=>`<div class="row"><img src="${x.image}"><div><b>${esc(x.title)}</b><small>${x.category_name||'ไม่ระบุ'} · ${x.status} · ${x.views} views</small></div><button onclick="edit(${x.id})">แก้ไข</button><button class="danger" onclick="del(${x.id})">ลบ</button></div>`).join('')+'</div>'}
async function edit(id){let a=await api('/api/articles?limit=100');current=a.find(x=>x.id===id);editor()}
function editor(){let a=current||{title:'',excerpt:'',content:'',image:'/uploads/placeholder.svg',category_id:'',author:'YouthNews',status:'published',featured:false};$('view').innerHTML=`<h1>${current?'แก้ไขข่าว':'เขียนข่าวใหม่'}</h1><div class="form"><label>พาดหัวข่าว<input id="f_title" value="${attr(a.title)}"></label><label>คำโปรย<textarea id="f_excerpt">${esc(a.excerpt)}</textarea></label><label>เนื้อหาข่าว<textarea id="f_content" rows="14">${esc(a.content)}</textarea></label><label>หมวดข่าว<select id="f_cat"><option value="">-- เลือก --</option>${cats.map(c=>`<option value="${c.id}" ${String(c.id)===String(a.category_id)?'selected':''}>${c.name}</option>`).join('')}</select></label><label>ผู้เขียน<input id="f_author" value="${attr(a.author)}"></label><label>สถานะ<select id="f_status"><option value="published" ${a.status==='published'?'selected':''}>เผยแพร่</option><option value="draft" ${a.status==='draft'?'selected':''}>ฉบับร่าง</option></select></label><label>ภาพปก<input type="file" id="f_file" accept="image/*" onchange="upload()"><input id="f_image" value="${attr(a.image)}"></label><label class="check"><input type="checkbox" id="f_featured" ${a.featured?'checked':''}> ข่าวเด่น</label><button onclick="save()">บันทึกข่าว</button></div>`}
async function upload(){let f=$('f_file').files[0];if(!f)return;let fd=new FormData();fd.append('image',f);let r=await fetch('/api/upload',{method:'POST',body:fd});let j=await r.json();$('f_image').value=j.url}
async function save(){let body={title:$('f_title').value,excerpt:$('f_excerpt').value,content:$('f_content').value,image:$('f_image').value,category_id:$('f_cat').value||null,author:$('f_author').value,status:$('f_status').value,featured:$('f_featured').checked};let url=current?'/api/articles/'+current.id:'/api/articles';await api(url,{method:current?'PUT':'POST',body:JSON.stringify(body)});show('articles')}
async function del(id){if(!confirm('ยืนยันลบข่าวนี้?'))return;await api('/api/articles/'+id,{method:'DELETE'});articles()}
async function settings(){let s=await api('/api/settings');$('view').innerHTML=`<h1>ตั้งค่าเว็บไซต์</h1><div class="form"><label>ชื่อเว็บไซต์<input id="s_name" value="${attr(s.site_name)}"></label><label>คำโปรย<input id="s_tag" value="${attr(s.tagline)}"></label><label>ข้อความ Breaking<input id="s_break" value="${attr(s.breaking)}"></label><label>อีเมลติดต่อ<input id="s_contact" value="${attr(s.contact)}"></label><label>Facebook URL<input id="s_fb" value="${attr(s.facebook)}"></label><label>Instagram URL<input id="s_ig" value="${attr(s.instagram)}"></label><button onclick="saveSettings()">บันทึกการตั้งค่า</button></div>`}
async function saveSettings(){await api('/api/settings',{method:'PUT',body:JSON.stringify({site_name:$('s_name').value,tagline:$('s_tag').value,breaking:$('s_break').value,contact:$('s_contact').value,facebook:$('s_fb').value,instagram:$('s_ig').value})});alert('บันทึกแล้ว')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function attr(s){return esc(s).replace(/"/g,'&quot;')}
api('/api/me').then(u=>u?($('login').classList.add('hidden'),$('app').classList.remove('hidden'),load()):0)
</script></body></html>
